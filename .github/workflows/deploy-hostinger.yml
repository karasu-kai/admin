name: Deploy to Hostinger

on:
  push:
    branches: [kodoco]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require KODOCO_PAT secret
        env:
          KODOCO_PAT: ${{ secrets.KODOCO_PAT }}
        run: |
          if [ -z "$KODOCO_PAT" ]; then
            echo "::error::KODOCO_PAT secret is not set."
            echo "Add a GitHub PAT with repo access as KODOCO_PAT in admin repo secrets."
            echo "See KODOCO-REPO.md"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run hostinger
      - run: bash scripts/verify-deploy.sh deploy

      - name: Push built site to kodoco repo (hostinger branch)
        env:
          KODOCO_PAT: ${{ secrets.KODOCO_PAT }}
        run: |
          bash scripts/push-built-site.sh \
            "https://x-access-token:${KODOCO_PAT}@github.com/karasu-kai/kodoco.git" \
            hostinger \
            deploy \
            "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: /public_html/
