name: Deploy to Hostinger

on:
  push:
    branches: [main, kodoco]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run hostinger

      - name: Publish to hostinger branch
        run: |
          cd deploy
          git init
          git checkout -b hostinger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" hostinger

      - name: Mirror to kodoco repo
        continue-on-error: true
        env:
          KODOCO_PAT: ${{ secrets.KODOCO_PAT }}
        if: env.KODOCO_PAT != ''
        run: |
          cd deploy
          git init
          git checkout -b hostinger
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${KODOCO_PAT}@github.com/karasu-kai/kodoco.git" hostinger
          cd ..
          git push -f "https://x-access-token:${KODOCO_PAT}@github.com/karasu-kai/kodoco.git" HEAD:main
