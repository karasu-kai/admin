name: Sync site to kodoco repo

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout built site from hostinger branch
        uses: actions/checkout@v4
        with:
          ref: hostinger
          repository: karasu-kai/admin

      - name: Verify files
        run: |
          echo "=== Site files ==="
          find . -type f | sort
          test -f index.html
          test -f .htaccess
          test -f assets/index-D3IqGYwh.css
          test -f assets/index-DBm-rzTJ.js
          echo "All files present including assets folder"

      - name: Push to kodoco repo (hostinger branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push -f "https://x-access-token:${{ secrets.KODOCO_PAT }}@github.com/karasu-kai/kodoco.git" HEAD:hostinger

      - name: Push to kodoco repo (main branch fallback)
        run: |
          git push -f "https://x-access-token:${{ secrets.KODOCO_PAT }}@github.com/karasu-kai/kodoco.git" HEAD:main
