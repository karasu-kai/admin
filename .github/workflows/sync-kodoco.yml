name: Sync site to kodoco repo

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to Hostinger"]
    types: [completed]
    branches: [kodoco]

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require KODOCO_PAT secret
        env:
          KODOCO_PAT: ${{ secrets.KODOCO_PAT }}
        run: |
          if [ -z "$KODOCO_PAT" ]; then
            echo "::error::KODOCO_PAT secret is missing."
            echo "Create a GitHub token with repo access and add it as KODOCO_PAT in admin repo secrets."
            echo "See KODOCO-REPO.md"
            exit 1
          fi

      - name: Checkout source from admin kodoco branch
        uses: actions/checkout@v4
        with:
          ref: kodoco
          repository: karasu-kai/admin

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run hostinger
      - run: bash scripts/verify-deploy.sh deploy

      - name: Push to kodoco repo (hostinger branch)
        env:
          KODOCO_PAT: ${{ secrets.KODOCO_PAT }}
        run: |
          bash scripts/push-built-site.sh \
            "https://x-access-token:${KODOCO_PAT}@github.com/karasu-kai/kodoco.git" \
            hostinger \
            deploy \
            "Sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Done
        run: echo "karasu-kai/kodoco hostinger branch updated — Hostinger Git will auto-deploy."
