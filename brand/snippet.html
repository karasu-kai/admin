<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crow slot drop-in — Karasu Kai</title>
  <meta name="robots" content="noindex"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root { --black:#0d0d0d; --off:#131313; --g3:#545454; --g4:#888; --white:#f0f0f0; --red:#c8102e; --line:#1e1e1e; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--black); color: var(--white); font-family: Syne, sans-serif; padding: 48px 24px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 1.4rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }
    p { font-family: 'DM Mono', monospace; font-size: .72rem; color: var(--g4); margin-bottom: 28px; }
    .preview {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 56px 24px; background: var(--off); border: 1px solid var(--line); margin-bottom: 28px;
    }
    .l-crow-slot { width: 72px; height: 72px; margin-bottom: 20px; }
    .l-crow-slot svg { width: 100%; height: 100%; display: block; }
    .l-logo { font-weight: 800; font-size: 2rem; letter-spacing: .14em; text-transform: uppercase; }
    .l-logo sup { font-size: .28em; color: var(--red); vertical-align: super; margin-left: .08em; }
    pre {
      font-family: 'DM Mono', monospace; font-size: .65rem; line-height: 1.55;
      color: var(--g3); background: var(--off); border: 1px solid var(--line);
      padding: 24px; overflow-x: auto; white-space: pre;
    }
    a { color: var(--g4); font-family: 'DM Mono', monospace; font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; }
    a:hover { color: var(--white); }
    .back { display: inline-block; margin-bottom: 32px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Brand preview</a>
    <h1>Drop-in for .l-crow-slot</h1>
    <p>Copy the markup below into karasukai.com.au where it says &lt;!-- YOUR CROW HERE --&gt;.</p>

    <div class="preview">
      <div class="l-crow-slot" id="crowSlot">
        <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="44" cy="46" rx="22" ry="20" fill="#f0f0f0"/>
          <circle cx="62" cy="30" r="11" fill="#f0f0f0"/>
          <path fill="#f0f0f0" d="M71 27 L88 22 L73 34 Z"/>
          <path fill="#f0f0f0" d="M52 36 C56 34 58 32 60 30 L64 38 C58 42 52 44 46 44 Z"/>
          <path fill="#f0f0f0" d="M24 48 L8 42 L10 52 L8 58 L24 52 Z"/>
          <path fill="#0d0d0d" fill-opacity=".5" d="M32 42 C40 36 52 36 60 42 C54 48 44 50 34 48 Z"/>
          <path fill="#f0f0f0" d="M34 64 L30 82 L34 80 L36 68 L38 80 L42 78 L36 64 Z"/>
          <path fill="#f0f0f0" d="M44 65 L43 83 L47 81 L48 70 L51 82 L55 80 L49 65 Z"/>
          <path fill="#f0f0f0" d="M54 64 L58 82 L62 80 L58 68 L61 80 L65 78 L58 64 Z"/>
          <circle cx="65" cy="28" r="2.6" fill="#c8102e"/>
        </svg>
      </div>
      <div class="l-logo">Karasu Kai<sup>®</sup></div>
    </div>

    <pre id="code"></pre>
  </div>
  <script>
    fetch('assets/crow-slot-inline.svg')
      .then(r => r.text())
      .then(svg => {
        const clean = svg.replace(/^<!--[\s\S]*?-->\n?/, '').trim();
        document.getElementById('code').textContent =
`<div class="l-crow-slot" id="crowSlot">
  ${clean}
</div>`;
      });
  </script>
</body>
</html>
